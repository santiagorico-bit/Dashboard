services:
  - type: web
    name: onair-kpi-feed
    runtime: node
    repo: https://github.com/santiagorico-bit/Dashboard
    branch: main
    region: frankfurt
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm run serve:sftp-kpis
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_RELEASE
        value: "2026-10-09.4"
      - key: DATABASE_URL
        fromDatabase:
          name: onair-resamania-data
          property: connectionString
      - key: LEGACY_KPI_FEED_URL
        value: https://wwtihyqhoshbkgqkozbh.supabase.co/functions/v1/club-kpis-feed
  - type: cron
    name: onair-resamania-sftp-sync
    runtime: node
    repo: https://github.com/santiagorico-bit/Dashboard
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "10 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: npm run sync:sftp-shadow
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RESAMANIA_SFTP_HOST
        sync: false
      - key: RESAMANIA_SFTP_PORT
        value: "22"
      - key: RESAMANIA_SFTP_USER
        sync: false
      - key: RESAMANIA_SFTP_PASSWORD
        sync: false
      - key: RESAMANIA_SFTP_PATH
        value: "."
      - key: RESAMANIA_SFTP_HOST_FINGERPRINT
        sync: false
      - key: RESAMANIA_SFTP_INGEST_URL
        value: https://wwtihyqhoshbkgqkozbh.supabase.co/functions/v1/ingest-resamania-sftp
      - key: RESAMANIA_SFTP_INGEST_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: onair-resamania-data
          property: connectionString
      - key: RESAMANIA_SFTP_MAX_FILES
        value: "100"
      - key: RESAMANIA_SFTP_INCLUDE_INIT
        value: "true"
      - key: RESAMANIA_SFTP_MAX_AGE_HOURS
        value: "0"

databases:
  - name: onair-resamania-data
    region: frankfurt
    plan: basic-256mb
    databaseName: onair_resamania
    user: onair_agent

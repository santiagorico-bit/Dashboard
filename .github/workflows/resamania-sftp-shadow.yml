name: Resamania SFTP shadow sync

on:
  schedule:
    # GitHub can delay individual scheduled events. Four lightweight attempts
    # per hour ensure that each hourly Resamania delivery is picked up without
    # reprocessing unchanged files.
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch:

concurrency:
  group: resamania-sftp-shadow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Never let a stalled SFTP transfer hold the concurrency lock for half an
    # hour: the next hourly delivery must still be able to run.
    timeout-minutes: 10
    env:
      RESAMANIA_SFTP_HOST: ssh.cluster131.hosting.ovh.net
      RESAMANIA_SFTP_PORT: "22"
      RESAMANIA_SFTP_USER: squadni-resa
      RESAMANIA_SFTP_PATH: .
      # A single hourly delivery currently contains more than 40 entity files
      # across all clubs. A lower cap produced successful-but-partial runs.
      RESAMANIA_SFTP_MAX_FILES: "100"
      # Bootstrap exports are intentionally excluded from the hourly lane.
      # Reprocessing a large _init file can consume the whole job timeout and
      # prevent current deltas from being published.
      RESAMANIA_SFTP_INCLUDE_INIT: "false"
      # The hourly lane is for current operations. Older missed deltas are
      # recovered separately so they cannot block today's publication.
      RESAMANIA_SFTP_MAX_AGE_HOURS: "24"
      RESAMANIA_SFTP_HOST_FINGERPRINT: SHA256:ry5S7obJV8ofKcdC3TCg0U/O11IGxQAEKHNkxImOgJ8,SHA256:N4DQHF8Pzfs8s5/QgV8tEx5NgKZeghhkDfpnO+ZG7Fo
      RESAMANIA_SFTP_INGEST_URL: https://wwtihyqhoshbkgqkozbh.supabase.co/functions/v1/ingest-resamania-sftp
      RESAMANIA_SFTP_PASSWORD: ${{ secrets.RESAMANIA_SFTP_PASSWORD }}
      RESAMANIA_SFTP_INGEST_TOKEN: ${{ secrets.RESAMANIA_SFTP_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: timeout 8m npm run sync:sftp-shadow
